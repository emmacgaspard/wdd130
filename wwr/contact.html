<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
      content="Contact Dry Oar White Water Rafting for information about our river adventures, reservations, and services.">
    <meta name="author" content="Caina Emmanuella Gaspard">

    <title>Contact Us | Dry Oar Rafting</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img class="logo" src="images/dry_oar_logo.jpg" alt="Dry Oar Rafting Company Logo">

        <nav class="primary-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-main">

        <h1>Contact Us</h1>

        <!-- COMPANY INFORMATION -->
        <section class="company-info">
            <h2>Dry Oar White Water Rafting Company</h2>

            <address>
                123 Main River Street<br>
                Kolob, California<br>
                Phone: +1 999 999 9999<br>
                Email: info@whitewater.com
            </address>
        </section>

        <!-- CONTACT INFORMATION, MAP AND FORM -->
        <section class="contact-section">

            <div class="map-container">
                <iframe src="https://www.google.com/maps?q=Kolob,California&output=embed"
                  width="100%" height="350" title="Map showing the Dry Oar company location"
                  loading="lazy">
                </iframe>
            </div>

            <form class="contact-form" action="#" method="post">

                <h2>Send Us a Message</h2>

                <label for="fullname">Name:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your name"
                  required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <fieldset>
                    <legend>Message Purpose</legend>

                    <label>
                        <input type="radio" name="purpose" value="general-inquiry" required>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation-question">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="website-suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <label for="message">Message:</label>
                <textarea id="message" name="message" placeholder="Type your message here..."
                  rows="6" required></textarea>

                <label class="newsletter">
                    <input type="checkbox" name="subscribe">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>

            </form>

        </section>

        <!-- EMPLOYEE PROFILES -->
        <section class="employee-section">

            <h2>We Are Here to Serve You</h2>

            <div class="employee-gallery">

                <figure>
                    <img src="images/Sarah_Janet.webp" alt="Sarah Janet, Operations Manager"
                      width="400" height="600">
                    <figcaption>
                        Sarah Janet — Operations Manager
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/Henry_Davis.webp" alt="Henry Davis , Lead River Guide"
                      width="400" height="266">
                    <figcaption>
                        Henry Davis — Lead River Guide
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/Emily_Brown.webp" alt="Emily Brown, Customer Service Manager"
                      width="400" height="267">
                    <figcaption>
                        Emily Brown — Customer Service Manager
                    </figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>
        <p>©2026 | Dry Oar! | Caina Emmanuella Gaspard</p>

        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank" rel="noopener">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>

            <a href="https://x.com" target="_blank" rel="noopener">
                <img src="images/x-social-media-icon.svg" alt="X social media icon">
            </a>

            <a href="https://instagram.com" target="_blank" rel="noopener">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
